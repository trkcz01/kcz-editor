# KÇZ (iPhone) - GitHub'ın Mac sunucusunda derler ve .ipa dosyasını "Artifacts" olarak verir.
name: KÇZ iOS derleme

on:
  push:
    branches: [main, kcz-ios]
  workflow_dispatch:

jobs:
  derle:
    name: iPhone için derle
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Kodu al
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Java 8 (derleme aracı)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: En yeni Xcode'u seç (iOS 26 SDK gerekli)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Gerekli araçlar
        run: |
          brew install make ldid
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Derle
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export SLIMMED=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"

      - name: iPhone dosyasını yükle (.ipa)
        uses: actions/upload-artifact@v5
        with:
          name: KCZ-iOS
          path: artifacts/*.ipa
          if-no-files-found: error
