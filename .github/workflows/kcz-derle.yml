# KÇZ (iPhone) - GitHub'ın Mac sunucusunda derler ve .ipa dosyasını "Artifacts" olarak verir.
name: KÇZ iOS derleme

on:
  push:
    branches: [main, kcz-ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    name: iPhone için derle
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Kodu al
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Java 8 (derleme aracı)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: En yeni Xcode'u seç (iOS 26 SDK gerekli)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Gerekli araçlar
        run: |
          brew install make ldid
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Derle
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export SLIMMED=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"
          # TrollStore sürümü (.tipa): bilgisayarsız kurulum, uygun iOS sürümlerinde
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" TROLLSTORE_JIT_ENT=1
          ls -la artifacts
          # Telefondan kolay indirilsin diye sabit adlar
          mkdir -p indir
          cp "$(ls artifacts/*.ipa | grep -v slimmed | grep -v trollstore | head -1)" indir/KCZ.ipa
          cp "$(ls artifacts/*trollstore.tipa | grep -v slimmed | head -1)" indir/KCZ-TrollStore.tipa || true

      - name: iPhone dosyasını yükle (.ipa)
        uses: actions/upload-artifact@v5
        with:
          name: KCZ-iOS
          path: indir/*
          if-no-files-found: error

      - name: Telefondan indirme bağlantısını güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kcz-ios-son
          name: KÇZ iPhone (son derleme)
          prerelease: true
          make_latest: false
          body: |
            Telefondan indir:
            - **KCZ.ipa** → AltStore / SideStore ile kur
            - **KCZ-TrollStore.tipa** → TrollStore ile kur (bilgisayarsız, uygun iOS sürümlerinde)
            Derleme: ${{ github.sha }}
          files: indir/*
