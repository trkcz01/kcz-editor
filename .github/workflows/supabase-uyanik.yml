# KCZ Editör: Supabase ücretsiz planı bir hafta kullanılmayan projeyi durdurur.
# Bu görev iki günde bir veritabanına küçük bir istek atar ve projeyi uyanık tutar.
# Sunucu cevap vermezse görev hata verir ve GitHub sana e-posta gönderir.
name: Supabase uyanik tut

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sunucuyu durt
        env:
          URL: https://czbhlimkrvtzpqcauful.supabase.co
          KEY: sb_publishable_TE0k_NwdBs98rThiP6a0kg_gkHBgUi7
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Deneme $i: HTTP $code - $(head -c 200 out.txt)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Supabase cevap vermiyor. Proje durdurulmus olabilir: supabase.com > proje > Restore project"
          exit 1
